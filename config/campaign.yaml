# Single source of truth for the binder design campaign.
#
# Both the prototype notebook and the production Snakefile read this file, so
# porting to SnakeMake is a translation of the execution graph.

campaign:
  name: insulin_receptor_binders
  smoke_test: true # Flip to false for the full campaign.

target:
  pdb: inputs/pdbs/insulin_target.pdb
  chain: A
  residue_range: [1, 150]
  hotspots: [A59, A83, A91]

rfdiffusion:
  contigs: "[A1-150/0 70-100]"
  checkpoint: Complex_base_ckpt.pt
  num_designs:
    smoke: 5        # Minimal prototyping batch
    full: 1000      # Production-scale trajectory count
  noise_scale_ca: 0 # Deterministic ODE denoising for tight PPI packing 
  noise_scale_frame: 0
  write_trajectory:
    smoke: true
    full: false
  verify_hotspot_contacts: true
  hotspot_contact_distance: 10.0 # Cβ–Cβ distance threshold (Å)
  min_hotspots_engaged: 3        # Require all hotspots engaged. Drop to 2 to allow partial engagement.

proteinmpnn:
  seqs_per_backbone:
    smoke: 2
    full: 8
  sampling_temperature: 0.1
  use_soluble_weights: true # SolubleMPNN model penalises surface hydrophobics; preferred for binders that must
                            # express and stay soluble.
  expected_binder_chain: A
  expected_target_chain: B
  design_chains: [A]
  fixed_chains: [B]

boltz2:
  msa_mode: msa_server # Change it single_sequence to avoid MSA
  msa_server_url: https://api.colabfold.com

complex_validation:
  engines: [boltz2, colabfold] # Both engines run so their outputs can be compared.
  colabfold_msa_mode: mmseqs2_api
  colabfold_model_type: alphafold2_multimer_v3
  # Run colabfold_batch twice, as upstream's README recommends: once with
  # --msa-only to fetch MSAs, then again to predict.
  colabfold_two_step: true
  
gates:
  step2_proteinmpnn:
    mpnn_score_max: 1.25
    mpnn_score_preferred_max: 1.10
    mpnn_score_marginal_max: 1.35
  step3a_esmfold:
    plddt_min: 80.0
    scrmsd_max: 2.0        
    expected_pass_rate: [0.15, 0.20]
  step3b_boltz2:
    plddt_min: 85.0
    scrmsd_max: 1.5        
    expected_pass_rate: [0.05, 0.10]
  step4_complex:
    pae_interaction_max: 10.0
    iptm_min: 0.70
    binder_rmsd_to_design_max: 2.0

# --- Controls ----------------------------------------------------------------
controls:
  enabled: true
  # Length-matched scramble of a passing design. Must score clearly worse on
  # pae_interaction than real designs, or the metric is wrong.
  negative_scramble: true

# --- Paths -------------------------------------------------------------------
paths:
  cache: ${BINDER_CACHE:-~/.cache/binder-pipeline}
  outputs: results
  backbones: results/01_backbones
  sequences: results/02_sequences
  esmfold: results/03a_esmfold
  boltz2_monomer: results/03b_boltz2
  complexes: results/04_complexes
  summary: results/final_leads_summary.csv
  logs: results/logs

# --- Containers --------------------------------------------------------------
containers:
  rfdiffusion:
    image: binder-rfdiffusion:latest
    upstream: https://github.com/RosettaCommons/RFdiffusion
    commit: null
  proteinmpnn:
    image: binder-proteinmpnn:latest
    upstream: https://github.com/dauparas/ProteinMPNN
    commit: null
  esmfold:
    image: binder-esmfold:latest
    model: esm2_t36_3B_UR50D
  boltz2:
    image: binder-boltz2:latest
    pip_version: null
  colabfold:
    image: binder-colabfold:latest
    version: 1.6.2
    base_image: ghcr.io/sokrypton/colabfold:1.6.2-cuda12
